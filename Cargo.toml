[workspace]
members = [
  "crates/awaz-core",
  "crates/awaz-audio",
  "crates/awaz-moonshine",
  "crates/awaz-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
cpal = "0.18.2"
crossbeam-channel = "0.5"
directories = "6.0"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
